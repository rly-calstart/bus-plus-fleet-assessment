<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Light-Duty Vehicles — Total Cost of Ownership</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --ink: #1f2a24;
    --muted: #5b6b63;
    --border: #dde3df;
    --bg-alt: #f6f8f6;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 20px;
    color: var(--ink);
    background: #ffffff;
    display: flex;
    flex-direction: column;
  }
  h1 { font-size: 1.25rem; margin: 0 0 20px 0; }
  h2 { font-size: 1rem; font-weight: 600; margin: 0 0 8px 0; }
  .block { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  #chart { width: 100%; flex: 1 1 auto; min-height: 500px; }
</style>
</head>
<body>

<h1>Light-Duty Vehicles — Total Cost of Ownership</h1>

<div class="block">
  <h2>Light-Duty Fleet Total Cost of Ownership</h2>
  <div id="chart"></div>
</div>

<script>
const DATA = {"chart_categories": ["Depreciation", "Fuel", "Maintenance", "Insurance", "License", "TCO"], "chart_series": [{"name": "Gasoline", "y": [2979574.22, 2434026.56, 2809840.82, 1971766.29, 98770.87, 10293978.76]}, {"name": "EV", "y": [3925938.57, 776851.01, 2128844.88, 2403578.93, 186190.8, 9421404.19]}]};

function renderChart() {
  const traces = DATA.chart_series.map(s => ({
    x: DATA.chart_categories,
    y: s.y,
    name: s.name,
    type: 'bar',
    hovertemplate: `${s.name}: $%{y:,.2f}<extra></extra>`,
  }));
  Plotly.newPlot('chart', traces, {
    barmode: 'group',
    margin: { t: 10, r: 10, b: 60, l: 80 },
    legend: { orientation: 'h', y: -0.2 },
    yaxis: { title: 'Cost ($)' },
    hovermode: 'x unified',
  }, { responsive: true, displaylogo: false });
}

renderChart();
</script>

</body>
</html>
