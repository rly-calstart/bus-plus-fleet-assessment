<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Light-Duty Vehicles — Total Cost of Ownership</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --ink: #1f2a24;
    --muted: #5b6b63;
    --border: #dde3df;
    --bg-alt: #f6f8f6;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 20px;
    color: var(--ink);
    background: #ffffff;
  }
  h1 { font-size: 1.25rem; margin: 0 0 20px 0; }
  h2 { font-size: 1rem; font-weight: 600; margin: 0 0 8px 0; }
  .block { margin-bottom: 32px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 0.8rem; }
  th, td {
    border: 1px solid var(--border);
    padding: 7px 10px;
    text-align: right;
    white-space: nowrap;
  }
  th { background: var(--bg-alt); }
  th:first-child, td:first-child { text-align: left; }
  #chart { width: 100%; min-height: 420px; }
</style>
</head>
<body>

<h1>Light-Duty Vehicles — Total Cost of Ownership</h1>

<div class="block">
  <h2>Total LDV TCO</h2>
  <div class="table-wrap" id="table-tco"></div>
</div>

<div class="block">
  <h2>Light-Duty Fleet Total Cost of Ownership</h2>
  <div id="chart"></div>
</div>

<script>
const DATA = {"powertrains": ["Gasoline", "EV", "Gasoline", "EV", "Gasoline", "EV", "Gasoline", "EV"], "rows": [{"label": "Financing", "values": [0, 0, 0, 0, 0, 0, 0, 0]}, {"label": "Depreciation", "values": [2231959.78, 3114362.49, 711615.09, 757158.45, 35999.35, 54417.62, 2979574.22, 3925938.57]}, {"label": "Fuel", "values": [2086180.51, 601851.01, 305419.06, 161042.18, 42426.99, 13957.83, 2434026.56, 776851.01]}, {"label": "DEF", "values": [0, 0, 0, 0, 0, 0, 0, 0]}, {"label": "Maintenance", "values": [2109227.96, 1687382.36, 637021.86, 402329.59, 63591.01, 39132.93, 2809840.82, 2128844.88]}, {"label": "Insurance", "values": [1492888.94, 1895516.78, 454798.5, 475579.29, 24078.85, 32482.85, 1971766.29, 2403578.93]}, {"label": "License", "values": [89430.59, 157181.04, 7895.11, 26471.85, 1445.16, 2537.91, 98770.87, 186190.8]}, {"label": "TCO", "values": [8009687.78, 7456293.68, 2116749.61, 1822581.36, 167541.37, 142529.14, 10293978.76, 9421404.19]}], "chart_categories": ["Financing", "Depreciation", "Fuel", "DEF", "Maintenance", "Insurance", "License", "TCO"], "chart_series": [{"name": "Gasoline", "y": [0, 2979574.22, 2434026.56, 0, 2809840.82, 1971766.29, 98770.87, 10293978.76]}, {"name": "EV", "y": [0, 3925938.57, 776851.01, 0, 2128844.88, 2403578.93, 186190.8, 9421404.19]}]};

function fmt(v) {
  if (v === null || v === undefined) return '';
  if (typeof v === 'number') {
    return v.toLocaleString(undefined, { maximumFractionDigits: 2 });
  }
  return v;
}

function renderTable() {
  const el = document.getElementById('table-tco');
  let html = '<table><thead>';

  // Row 1: top-level groups
  html += '<tr><th rowspan="3"></th>' +
    '<th colspan="2">Non-Bus Van</th>' +
    '<th colspan="4">School Passenger Vehicle</th>' +
    '<th colspan="2">Entire LDV Fleet</th></tr>';

  // Row 2: subgroups
  html += '<tr><th colspan="2"></th>' +
    '<th colspan="2">Car</th>' +
    '<th colspan="2">Van</th>' +
    '<th colspan="2"></th></tr>';

  // Row 3: powertrain
  html += '<tr>' + DATA.powertrains.map(p => `<th>${p}</th>`).join('') + '</tr>';

  html += '</thead><tbody>';
  DATA.rows.forEach(row => {
    html += `<tr><td>${row.label}</td>` + row.values.map(v => `<td>${fmt(v)}</td>`).join('') + '</tr>';
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}

function renderChart() {
  const traces = DATA.chart_series.map(s => ({
    x: DATA.chart_categories,
    y: s.y,
    name: s.name,
    type: 'bar',
    hovertemplate: `${s.name}: %{y:,.2f}<extra></extra>`,
  }));
  Plotly.newPlot('chart', traces, {
    barmode: 'group',
    margin: { t: 10, r: 10, b: 60, l: 80 },
    legend: { orientation: 'h', y: -0.2 },
    yaxis: { title: 'Cost ($)' },
    hovermode: 'x unified',
  }, { responsive: true, displaylogo: false });
}

renderTable();
renderChart();
</script>

</body>
</html>
