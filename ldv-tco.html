<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Light-Duty Vehicles — Total Cost of Ownership</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --ink: #1f2a24;
    --muted: #5b6b63;
    --border: #dde3df;
    --bg-alt: #f6f8f6;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 20px;
    color: var(--ink);
    background: #ffffff;
    display: flex;
    flex-direction: column;
  }
  h1 { font-size: 1.25rem; margin: 0 0 20px 0; }
  h2 { font-size: 1rem; font-weight: 600; margin: 0 0 8px 0; }
  .block { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  #chart { width: 100%; flex: 1 1 auto; min-height: 500px; }
</style>
</head>
<body>

<h1>Light-Duty Vehicles — Total Cost of Ownership</h1>

<div class="block">
  <h2>Light-Duty Fleet Total Cost of Ownership</h2>
  <div id="chart"></div>
</div>

<script>
const DATA = {"powertrains": ["Gasoline", "EV"], "chart_series": [{"name": "Depreciation", "y": [2979574.22, 3925938.57]}, {"name": "Fuel", "y": [2434026.56, 776851.01]}, {"name": "Maintenance", "y": [2809840.82, 2128844.88]}, {"name": "Insurance", "y": [1971766.29, 2403578.93]}, {"name": "License", "y": [98770.87, 186190.8]}]};

function renderChart() {
  const totals = DATA.powertrains.map((_, i) =>
    DATA.chart_series.reduce((sum, s) => sum + s.y[i], 0)
  );

  const traces = DATA.chart_series.map(s => ({
    y: DATA.powertrains,
    x: s.y,
    name: s.name,
    type: 'bar',
    orientation: 'h',
    text: s.y.map(v => s.name + ': $' + v.toLocaleString(undefined, { maximumFractionDigits: 0 })),
    textposition: 'inside',
    insidetextanchor: 'middle',
    hovertemplate: `${s.name}: $%{x:,.2f}<extra></extra>`,
  }));

  const annotations = DATA.powertrains.map((p, i) => ({
    x: totals[i],
    y: p,
    text: 'Total TCO: $' + totals[i].toLocaleString(undefined, { maximumFractionDigits: 0 }),
    showarrow: false,
    xanchor: 'left',
    xshift: 8,
    font: { size: 12, color: '#1f2a24' },
  }));

  Plotly.newPlot('chart', traces, {
    annotations: annotations,
    barmode: 'stack',
    margin: { t: 10, r: 110, b: 60, l: 90 },
    legend: { orientation: 'h', y: -0.2 },
    xaxis: { title: 'Cost ($)' },
    hovermode: 'y unified',
  }, { responsive: true, displaylogo: false });
}

renderChart();
</script>

</body>
</html>
