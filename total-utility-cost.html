    --ink: #1f2a24;
    --muted: #5b6b63;
    --border: #dde3df;
    --bg-alt: #f6f8f6;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 20px;
    color: var(--ink);
    background: #ffffff;

  .block { margin-bottom: 32px; }
  .fleet-row {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-start;
  }
  .fleet-col {
    flex: 1 1 300px;
    min-width: 0;
  }
  .fleet-col .table-wrap { max-height: 480px; overflow-y: auto; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 0.78rem; }
  th, td {
    border: 1px solid var(--border);
    padding: 6px 9px;
    text-align: right;
    white-space: nowrap;
  }
  th { background: var(--bg-alt); }
  th:first-child, td:first-child { text-align: left; }
  #chart { width: 100%; min-height: 420px; }

function fmt(v) {
  if (v === null || v === undefined) return '';
  if (typeof v === 'number') {
    return v.toLocaleString(undefined, { maximumFractionDigits: 4 });
  }
  return v;
}

function renderFleetTable(containerId, fleetTable) {
  const el = document.getElementById(containerId);
  let html = '<table><thead><tr><th>Year</th>' +
    fleetTable.headers.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>';
  fleetTable.rows.forEach((row, i) => {
    html += `<tr><td>${DATA.years[i]}</td>` + row.map(v => `<td>${fmt(v)}</td>`).join('') + '</tr>';
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}

function renderChart() {
  const traces = DATA.chart_series.map(s => ({
    x: DATA.chart_categories.slice(0, s.y.length),
    y: s.y,
    name: s.name,
    type: 'bar',
    hovertemplate: `${s.name}: %{y:,.2f}<extra></extra>`,
  }));
  Plotly.newPlot('chart', traces, {
    barmode: 'group',
    margin: { t: 10, r: 10, b: 60, l: 80 },
    legend: { orientation: 'h', y: -0.2 },
    xaxis: { title: 'Year', dtick: 1 },
    yaxis: { title: 'Cost ($)' },
    hovermode: 'x unified',
  }, { responsive: true, displaylogo: false });
}

renderFleetTable('table-total', DATA.total_fleet);

renderFleetTable('table-non-bus', DATA.non_bus_fleet);
