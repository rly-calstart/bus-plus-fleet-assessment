<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Total Utility Cost</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --ink: #1f2a24;
    --muted: #5b6b63;
    --border: #dde3df;
    --bg-alt: #f6f8f6;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 20px;
    color: var(--ink);
    background: #ffffff;
    display: flex;
    flex-direction: column;
  }
  h1 { font-size: 1.25rem; margin: 0 0 20px 0; }
  h2 { font-size: 1rem; font-weight: 600; margin: 0 0 8px 0; }
  .block { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  #chart { width: 100%; flex: 1 1 auto; min-height: 500px; }
</style>
</head>
<body>

<h1>Total Utility Cost</h1>

<div class="block">
  <h2>Projected Utility Costs</h2>
  <div id="chart"></div>
</div>

<script>
const DATA = {"chart_categories": [2027, 2028, 2029, 2030, 2031, 2032, 2033, 2034, 2035, 2036, 2037, 2038, 2039, 2040, 2041, 2042, 2043, 2044, 2045, 2046, 2047, 2048], "chart_series": [{"name": "Utility cost- Bus", "y": [45406.2463, 89222.8525, 133039.4588, 162626.0974, 220672.6713, 264489.2775, 308305.8838, 352122.4901, 376708.7887, 413566.3774, 413566.3774, 413566.3774, 413566.3774, 413566.3774, 413566.3774, 413566.3774, 413566.3774, 413566.3774, 413566.3774, 413566.3774, 413566.3774, 413566.3774]}, {"name": "Utility Cost Non-Bus", "y": [8834.0458, 16984.0022, 25133.9587, 33283.9152, 41433.8717, 49583.8282, 57733.7846, 52392.5482, 52392.5482, 52392.5482, 52392.5482, 52392.5482, 52392.5482, 52392.5482, 52392.5482, 52392.5482, 52392.5482, 52392.5482, 52392.5482, null, null, null]}, {"name": "Utility Cost- Passenger Vehicles", "y": [10730.7913, 19871.9427, 27779.9702, 28970.183, 24252.6876, 24252.6876, 24252.6876, 24252.6876, 24252.6876, 24252.6876, 24252.6876, 24252.6876, 24252.6876, 24252.6876, 24252.6876, 24252.6876, null, null, null, null, null, null]}], "total_utility_cost": [64971.0834, 126078.7974, 185953.3877, 224880.1956, 286359.2305, 338325.7933, 390292.356, 428767.7258, 453354.0244, 490211.6131, 490211.6131, 490211.6131, 490211.6131, 490211.6131, 490211.6131, 490211.6131, 465958.9255, 465958.9255, 465958.9255, 413566.3774, 413566.3774, 413566.3774]};

function renderChart() {
  const totals = DATA.chart_categories.map((_, i) =>
    DATA.chart_series.reduce((sum, s) => sum + (s.y[i] || 0), 0)
  );

  const traces = DATA.chart_series.map(s => ({
    x: DATA.chart_categories,
    y: s.y,
    name: s.name,
    type: 'bar',
    hovertemplate: `${s.name}: $%{y:,.2f}<extra></extra>`,
  }));

  const annotations = DATA.chart_categories.map((c, i) => ({
    x: c,
    y: totals[i],
    text: '$' + totals[i].toLocaleString(undefined, { maximumFractionDigits: 0 }),
    showarrow: false,
    yanchor: 'bottom',
    yshift: 4,
    font: { size: 11, color: '#1f2a24' },
  }));

  Plotly.newPlot('chart', traces, {
    annotations: annotations,
    barmode: 'stack',
    margin: { t: 40, r: 10, b: 60, l: 80 },
    legend: { orientation: 'h', y: -0.2 },
    xaxis: { title: 'Year', dtick: 1 },
    yaxis: { title: 'Cost ($)' },
    hovermode: 'x unified',
  }, { responsive: true, displaylogo: false });
}

renderChart();
</script>

</body>
</html>
