<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zero-Emission Bus Fleet: Emissions & Fuel Savings</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --ink: #1f2a24;
    --muted: #5b6b63;
    --border: #dde3df;
    --accent: #2f6f4f;
    --bg-alt: #f6f8f6;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 16px;
    color: var(--ink);
    background: #ffffff;
  }
  h1 {
    font-size: 1.25rem;
    margin: 0 0 4px 0;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 20px;
  }
  .chart-block {
    margin-bottom: 28px;
  }
  .chart-title {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 4px;
  }
  #chart1, #chart2 {
    width: 100%;
    min-height: 380px;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 0.78rem;
  }
  caption {
    text-align: left;
    font-weight: 600;
    font-size: 1rem;
    margin-bottom: 8px;
  }
  th, td {
    border: 1px solid var(--border);
    padding: 6px 8px;
    text-align: right;
    white-space: nowrap;
  }
  th {
    background: var(--bg-alt);
    cursor: pointer;
    user-select: none;
    position: sticky;
    top: 0;
  }
  th:first-child, td:first-child {
    text-align: left;
    position: sticky;
    left: 0;
    background: #fff;
  }
  th.sort-asc::after { content: " \25B2"; }
  th.sort-desc::after { content: " \25BC"; }
  .table-wrap {
    overflow-x: auto;
    max-height: 480px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  tbody tr:nth-child(even) { background: #fbfcfb; }
  tbody tr:hover { background: #eef4f0; }
</style>
</head>
<body>

<h1>Zero-Emission Bus Fleet: Emissions & Fuel Savings</h1>

<div class="chart-block">
  <div class="chart-title">Air Pollutants, 2026&ndash;2037</div>
  <div id="chart1"></div>
</div>

<div class="chart-block">
  <div class="chart-title">GHG Emissions and Fuel Savings, 2026&ndash;2037</div>
  <div id="chart2"></div>
</div>

<script>
const DATA = {"years": [2026, 2027, 2028, 2029, 2030, 2031, 2032, 2033, 2034, 2035, 2036, 2037], "chart1_series": [{"name": "# operating ESBs", "y": [0, 38, 77, 115, 146, 175, 204, 233, 253, 273, 281, 281]}, {"name": "NOx Emissions (lbs)", "y": [4516.767746102939, 4038.2270009167864, 3558.6867088996523, 3080.583638316106, 2611.4730705862357, 2144.52491426925, 1677.5767579522644, 1210.6286016352788, 752.6763667971286, 294.72413195897843, 0, 0]}, {"name": "PM2.5 (lbs)", "y": [154.52386507031866, 147.64083339074278, 140.6557021346494, 133.81737710632126, 127.90741286309654, 122.22487253590012, 116.5423322087037, 105.63722607864776, 91.37800775309142, 77.11878942753509, 71.04309977700905, 71.04309977700905]}, {"name": "Carbon Monoxide (CO) (lbs)", "y": [60313.39847042106, 53242.17601455271, 46135.45656756978, 39079.77728686662, 32395.22305217124, 25821.978404734997, 19248.733757298753, 12675.489109862508, 6421.717382457405, 167.94565505230094, 0, 0]}, {"name": "VOC (lbs)", "y": [3667.202944490814, 3224.7945963421553, 2778.668107285976, 2337.88783277398, 1932.1310836403327, 1535.466779307763, 1138.8024749751935, 742.1381706426239, 378.9371344777398, 15.736098312855688, 0, 0]}, {"name": "SOx (lbs)", "y": [62.86520067767377, 55.35205049530643, 47.72952202582196, 40.24490908093402, 33.48716036665587, 26.846213073860135, 20.205265781064398, 13.564318488268663, 7.907775779527108, 2.2512330707855526, 0, 0]}], "chart2_series": [{"name": "# operating ESBs", "y": [0, 38, 77, 115, 146, 175, 204, 233, 253, 273, 281, 281]}, {"name": "GHG emissions (short tons)", "y": [6081.452435128469, 5591.16645258696, 5092.2309503385095, 4603.725987187544, 4167.234306875575, 3737.6033775296446, 3307.972448183714, 2878.341518837783, 2526.5562668543253, 2174.7710148708675, 2052.981140062725, 2052.981140062725]}], "chart2_lines": [{"name": "Annual Fuel savings vs BAU (GGE)", "y": [0, 1473.0672427552845, 2968.691897014859, 4435.885099346515, 5753.304537638161, 7046.69200504425, 8340.079472450341, 9633.466939856431, 10723.83770372391, 11814.208467591388, 12218.009718668336, 12218.009718668336]}, {"name": "Annual Fuel savings vs BAU (DGE)", "y": [0, 1288.9941514516838, 2597.7269615721552, 3881.5810871433596, 5034.3770367637, 6166.144027881509, 7297.911018999318, 8429.678010117128, 9383.797073215846, 10337.916136314565, 10691.258764457934, 10691.258764457934]}]};

function renderChart1() {
  const traces = DATA.chart1_series.map(s => ({
    x: DATA.years,
    y: s.y,
    name: s.name,
    type: 'bar',
    hovertemplate: `${s.name}: %{y:,.2f}<extra></extra>`,
  }));
  Plotly.newPlot('chart1', traces, {
    barmode: 'stack',
    margin: { t: 10, r: 10, b: 40, l: 55 },
    legend: { orientation: 'h', y: -0.2 },
    xaxis: { title: 'Year', dtick: 1 },
    yaxis: { title: 'Count / pounds' },
    hovermode: 'x unified',
  }, { responsive: true, displaylogo: false });
}

function renderChart2() {
  const barTraces = DATA.chart2_series.map(s => ({
    x: DATA.years,
    y: s.y,
    name: s.name,
    type: 'bar',
    yaxis: 'y',
    hovertemplate: `${s.name}: %{y:,.2f}<extra></extra>`,
  }));
  const lineTraces = DATA.chart2_lines.map(s => ({
    x: DATA.years,
    y: s.y,
    name: s.name,
    type: 'scatter',
    mode: 'lines+markers',
    yaxis: 'y2',
    hovertemplate: `${s.name}: %{y:,.2f}<extra></extra>`,
  }));
  Plotly.newPlot('chart2', [...barTraces, ...lineTraces], {
    barmode: 'group',
    margin: { t: 10, r: 55, b: 40, l: 55 },
    legend: { orientation: 'h', y: -0.2 },
    xaxis: { title: 'Year', dtick: 1 },
    yaxis: { title: 'Count / short tons' },
    yaxis2: {
      title: 'Fuel savings (gallons)',
      overlaying: 'y',
      side: 'right',
      showgrid: false,
    },
    hovermode: 'x unified',
  }, { responsive: true, displaylogo: false });
}

function fmt(v) {
  if (v === null || v === undefined) return '';
  if (typeof v === 'number') {
    return Number.isInteger(v) ? v.toString() : v.toFixed(2);
  }
  return v;
}

renderChart1();
renderChart2();
</script>

</body>
</html>
