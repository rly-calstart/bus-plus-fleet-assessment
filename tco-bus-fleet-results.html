<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCO Bus Fleet — Results</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --ink: #1f2a24;
    --muted: #5b6b63;
    --border: #dde3df;
    --bg-alt: #f6f8f6;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 20px;
    color: var(--ink);
    background: #ffffff;
    display: flex;
    flex-direction: column;
  }
  h1 { font-size: 1.25rem; margin: 0 0 20px 0; }
  h2 { font-size: 1rem; font-weight: 600; margin: 0 0 8px 0; }
  .block { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  #chart1 { width: 100%; flex: 1 1 auto; min-height: 500px; }
</style>
</head>
<body>

<h1>TCO Bus Fleet — Results</h1>

<div class="block">
  <h2>Cost Components</h2>
  <div id="chart1"></div>
</div>

<script>
const DATA = {"chart_categories": ["Diesel", "Gas", "Battery"], "chart_series": [{"name": "Vehicle Capital Expense", "y": [21886438, 18466480, 41706000]}, {"name": "Fuel Cost", "y": [6603006.71, 6064954.96, 4965026.74]}, {"name": "Maintenance ", "y": [13947853.92, 14554144.8, 8368712.35]}]};

function renderChart1() {
  const totals = DATA.chart_categories.map((_, i) =>
    DATA.chart_series.reduce((sum, s) => sum + s.y[i], 0)
  );

  const traces = DATA.chart_series.map(s => ({
    x: DATA.chart_categories,
    y: s.y,
    name: s.name,
    type: 'bar',
    text: s.y.map(v => s.name + ': $' + v.toLocaleString(undefined, { maximumFractionDigits: 0 })),
    textposition: 'inside',
    insidetextanchor: 'middle',
    hovertemplate: `${s.name}: $%{y:,.2f}<extra></extra>`,
  }));

  const annotations = DATA.chart_categories.map((c, i) => ({
    x: c,
    y: totals[i],
    text: 'Total: $' + totals[i].toLocaleString(undefined, { maximumFractionDigits: 0 }),
    showarrow: false,
    yanchor: 'bottom',
    yshift: 4,
    font: { size: 12, color: '#1f2a24' },
  }));

  Plotly.newPlot('chart1', traces, {
    annotations: annotations,
    barmode: 'stack',
    margin: { t: 40, r: 10, b: 60, l: 70 },
    legend: { orientation: 'h', y: -0.25 },
    yaxis: { title: 'Cost ($)' },
    hovermode: 'x unified',
  }, { responsive: true, displaylogo: false });
}

renderChart1();
</script>

</body>
</html>
