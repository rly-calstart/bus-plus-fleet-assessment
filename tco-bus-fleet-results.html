<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCO Bus Fleet — Results</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --ink: #1f2a24;
    --muted: #5b6b63;
    --border: #dde3df;
    --bg-alt: #f6f8f6;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 20px;
    color: var(--ink);
    background: #ffffff;
  }
  h1 { font-size: 1.25rem; margin: 0 0 20px 0; }
  h2 { font-size: 1rem; font-weight: 600; margin: 0 0 8px 0; }
  .block { margin-bottom: 32px; }
  #chart1, #chart2 { width: 100%; min-height: 400px; }
</style>
</head>
<body>

<h1>TCO Bus Fleet — Results</h1>

<div class="block">
  <h2>Cost Components</h2>
  <div id="chart1"></div>
</div>

<div class="block">
  <h2>Cumulative Cashflow (Clean Fuel vs. Baseline Fuel)</h2>
  <div id="chart2"></div>
</div>

<script>
const DATA = {"chart1_categories": ["Vehicle Capital Expense", "Fuel Cost", "Maintenance "], "chart1_series": [{"name": "Diesel", "y": [21886438, 6603006.71, 13947853.92]}, {"name": "Gas", "y": [18466480, 6064954.96, 14554144.8]}, {"name": "Battery", "y": [41706000, 4965026.74, 8368712.35]}], "chart2_years": [2026, 2027, 2028, 2029, 2030, 2031, 2032, 2033, 2034, 2035, 2036, 2037, 2038, 2039, 2040], "chart2_series": [{"name": "Baseline vehicle", "y": [0, 4466620, 7648967.61, 12829756.4, 18379876.14, 24285491.01, 24280017.43, 25912873.69, 25917938.08, 25921635.92, 23244903.76, 18561237.81, 13518230.66, 8110138.66, 2339893.51]}, {"name": "ESB - without incentives", "y": [0, 4477460, 9043397.54, 13706584.11, 18467019.72, 23324704.37, 23324704.37, 23324704.37, 23324704.37, 23324704.37, 22429212.37, 17934640.06, 13349835.92, 8667782.74, 3888480.52]}]};

function renderChart1() {
  const traces = DATA.chart1_series.map(s => ({
    x: DATA.chart1_categories,
    y: s.y,
    name: s.name,
    type: 'bar',
    hovertemplate: `${s.name}: $%{y:,.2f}<extra></extra>`,
  }));
  Plotly.newPlot('chart1', traces, {
    barmode: 'group',
    margin: { t: 10, r: 10, b: 60, l: 70 },
    legend: { orientation: 'h', y: -0.25 },
    yaxis: { title: 'Cost ($)' },
    hovermode: 'x unified',
  }, { responsive: true, displaylogo: false });
}

function renderChart2() {
  const traces = DATA.chart2_series.map(s => ({
    x: DATA.chart2_years,
    y: s.y,
    name: s.name,
    type: 'scatter',
    mode: 'lines+markers',
    hovertemplate: `${s.name}: $%{y:,.2f}<extra></extra>`,
  }));
  Plotly.newPlot('chart2', traces, {
    margin: { t: 10, r: 10, b: 40, l: 70 },
    legend: { orientation: 'h', y: -0.2 },
    xaxis: { title: 'Year', dtick: 1 },
    yaxis: { title: 'Cumulative real cash flow ($)' },
    hovermode: 'x unified',
  }, { responsive: true, displaylogo: false });
}

renderChart1();
renderChart2();
</script>

</body>
</html>
